# =====================================================================
# VetSalud ERP · configuración (APF3)
# La aplicación usa el rol de PRIVILEGIO MÍNIMO vetsalud_app (04_seguridad.sql, RNF-15):
# no puede borrar tablas, ni modificar auditoría, kardex o historial de citas.
# Las claves de laboratorio se reemplazan en producción con variables de entorno
# VETSALUD_DB_CLAVE y VETSALUD_DB_CLAVE_REPORTES (nunca se suben claves reales a GitHub).
# =====================================================================
# stringtype=unspecified: los textos se envían sin tipo y PostgreSQL los convierte a los ENUM (estado_cita, medio_pago...)
db.url=jdbc:postgresql://localhost:5432/vetsalud_erp?stringtype=unspecified
db.usuario=vetsalud_app
db.clave=App_CambiarEsto_2026

# Reportes: rol de solo lectura sobre vistas (S10)
db.reportes.usuario=vetsalud_reportes
db.reportes.clave=Rep_CambiarEsto_2026

app.zona=America/Lima
app.puerto=8080
